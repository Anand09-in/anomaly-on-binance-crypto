global:
  scrape_interval:     15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: metrics-exporter
    static_configs:
      - targets: ["metrics-exporter:8000"]

  - job_name: binance-producer
    static_configs:
      - targets: ["producer:8001"]
